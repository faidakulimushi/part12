services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bloglist-frontend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bloglist-backend
    restart: unless-stopped
    environment:
      - PORT=3004
      - MONGODB_URI=mongodb://mongo:27017/bloglist
      - SECRET=production-secret
    depends_on:
      - mongo

  mongo:
    image: mongo:8
    container_name: bloglist-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  nginx:
    image: nginx:alpine
    container_name: bloglist-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mongo-data:
